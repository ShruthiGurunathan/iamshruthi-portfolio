<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%</title>
<style>
@font-face { font-family: "Xanh Mono"; src: url("https://iamshruthi.com/assets/media/1e6182c74b6c0149277d.ttf") format("truetype"); font-display: swap; }
@font-face {font-family:"Xanh Mono";src:url("https://iamshruthi.com/assets/media/3aa6b644deb964b908d5.ttf");font-style:italic;font-display:swap}
@font-face {font-family:"Neue Haas Grotesk Display";src:url("https://iamshruthi.com/assets/media/0318836fa1bd7a019f14.otf");font-weight:300;font-display:swap}
@font-face {font-family:"Neue Haas Grotesk Display";src:url("https://iamshruthi.com/assets/media/dd9f9d98d52e87a2012e.otf");font-weight:400;font-display:swap}
@font-face {font-family:"Neue Haas Grotesk Display";src:url("https://iamshruthi.com/assets/media/c4566f8e64a2744a99dd.otf");font-weight:700;font-display:swap}
:root {
  --paper: #f2efe7;
  --ink: #9f491f;
  --line: #978878;
  --case-media-radius: 10px;
  --case-panel-gap: 20px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.5 "Neue Haas Grotesk Display", Arial, sans-serif; }
.page-wrap { width: 88%; margin: auto; padding: 0 0 64px; }
h1, h2, h3, p { margin: 0; }
.case-study-hero { padding: calc(var(--llw-vh, 1vh) * 30) 0 calc(var(--llw-vh, 1vh) * 20); }
.case-study-hero h1 { margin-bottom:48px;font-size:8vw;font-weight:400;line-height:1; }
.case-study-hero h1 span, .display-medium-alt_wrap, .health-small-title { font-family: "Xanh Mono", Georgia, serif; font-style: italic; font-weight: 400; }
.case-study-hero h1 span { font-size:1em;padding-right:.35em;letter-spacing:-.08em;line-height:.8; }
.discipline-tags { display: flex; flex-wrap: wrap; gap: .8em .6em; margin: 0; padding: 0; list-style: none; }
.discipline-tags li { border: 1px solid currentColor; border-radius: 50px; padding:.5em .6em;letter-spacing:.1em; font: italic 400 14px/1.25 "Xanh Mono", Georgia, serif; }
.subtitle { max-width: 50vw;margin-top:48px;font-weight:300; font-size:28px; line-height: 1.2; }
.casestudy_arrow { display: block; width: calc(50% + (100vw - 100%) / 2); margin:calc(var(--llw-vh, 1vh) * 6) 0 calc(var(--llw-vh, 1vh) * 6) -6vw; }
.health-opening-image { display: block; width: 100%; height: auto; border-radius: var(--case-media-radius); transform: scale(.6); transform-origin: center; margin: 0 0 56px; }
.full-width-content { margin-inline: -6vw; }
.copy-block { margin-left: auto; max-width: 560px; }
.eyebrow { font: italic 400 24px/1.1 "Xanh Mono",Georgia,serif; margin-bottom: 10px; }
.body-copy-small, .body-copy-large { font-size:clamp(16px,1.2vw,19px);font-weight:300;line-height:1.45;letter-spacing:.05em;overflow-wrap:break-word; }
.content-section { display: grid; gap: 46px; padding: 70px 0; }
.section-copy-wrap { display: grid; grid-template-columns: 1fr 1fr; align-items:start;gap:24px; }
.display-medium { font-size:5.5vw;font-weight:400;line-height:.76;white-space:nowrap; }
.display-medium-alt_wrap {font-size:5.5vw;padding-right:.35em;letter-spacing:-.08em;line-height:.8;}
.health-small-title { font-size:28px; }
.health-panel { min-width: 0; }
.health-panel-title { display:table;align-self:flex-start;max-width:100%;padding:8px 11px;border-radius:3px;background:var(--paper);color:var(--ink);font-family:"Neue Haas Grotesk Display",Arial,sans-serif;font-size:clamp(12px,1vw,15px);font-weight:700;line-height:1.25;letter-spacing:0; }
.harmony-system .health-panel-title {padding:0;background:transparent;}
.health-panel img { display: block; max-width: 100%; height: auto; border-radius: 5px; }
.harmony-screen .harmony-media { padding: 12px; background: #ffffff70; border-radius: var(--case-media-radius); }
.case_study_pagination { display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:24px;margin-top:40px; }
.case_study_pagination a { font-size: 21px; text-underline-offset: 4px; }
.case_study_pagination small { display: block; font-size: 14px; }
a { color: inherit; }
.case_study_pagination a:last-child { justify-self:end;text-align:right }
.case_study_pagination .large-button { border:1px solid currentColor;border-radius:200px;padding:18px 22px;font:400 clamp(22px,3vw,36px)/1.15 "Xanh Mono",serif;text-decoration:none;text-align:center; }
.case_study_pagination .large-button:is(:hover,:focus-visible) {background:var(--ink);color:var(--paper);border-color:var(--ink)}
.case_study_pagination a:is(:hover,:focus-visible) {color:var(--hover-accent,#4c7788)}
.section-marquee {overflow:hidden;margin:48px -6vw 0;padding:12px 0}
.section-marquee-track {display:flex;width:max-content;animation:section-marquee 25s linear infinite}
.section-marquee-track>div {flex:none;white-space:nowrap}
.section-marquee-item {display:inline-block;padding-inline:24px;font-size:clamp(25px,4vw,56px)}
.section-marquee-item i {font-family:"Xanh Mono",serif}
.section-marquee-item span {margin-left:.6em}
@keyframes section-marquee {to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce) {.section-marquee-track{animation:none;width:auto}.section-marquee-track>div{white-space:normal}.section-marquee-track>div+div{display:none}.health-opening-image{transform:none!important}}
@media (hover:hover) and (pointer:fine) {html,body,body * {cursor:none!important}}
a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
@media (min-width:1440px) {.display-medium{font-size:5vw}}
@media (max-width:991px) {
  .case-study-hero h1{margin-bottom:24px}
  .subtitle{max-width:75vw;margin-top:40px;font-size:24px}
  .eyebrow{font-size:18px}
}
@media (max-width: 767px) {
  .content-section { gap:28px; padding:40px 0; }
  .section-copy-wrap { grid-template-columns:1fr;gap:12px; }
  .case-study-hero h1 span {padding-right:.5em}
  .case-study-hero {padding:calc(var(--llw-vh, 1vh) * 23) 0 36px}
  .casestudy_arrow {width:80vw;margin-top:1vh;margin-bottom:20px}
  .case_study_pagination {grid-template-columns:1fr 1fr}
  .case_study_pagination .large-button {grid-row:2;grid-column:1/-1;justify-self:center}
  .subtitle { max-width:100%;font-size:22px }
  .health-opening-image { margin-bottom: 32px; }
}
@media (max-width:479px) {
  .case-study-hero h1{font-size:44px}
  .subtitle{margin-top:32px;font-size:20px}
  .discipline-tags li{font-size:10px}
  .display-medium{font-size:28px}
  .eyebrow{font-size:15px;line-height:1}
}
</style>
</head>
<body>
<main class="page-wrap">
<section class="case-study-hero">%%HERO%%</section>
<svg class="casestudy_arrow" viewBox="0 0 722 124" fill="none" aria-hidden="true" focusable="false">
  <path d="M0 .5h686a33 33 0 0 1 33 33V120" stroke="currentColor"/>
  <path d="m716 119 3 5 3-5z" fill="currentColor"/>
</svg>
<div class="full-width-content">%%COVER%%</div>
%%ABOUT%%
<div class="section-marquee" aria-hidden="true"><div class="section-marquee-track"><div>%%MARQUEE%%</div><div>%%MARQUEE%%</div></div></div>
%%BODY%%
<div class="case_study_pagination">%%PAGINATION%%</div>
</main>
<script>
const page = document.querySelector('.page-wrap');
const portfolioOrigin = 'https://iamshruthi.com';
new ResizeObserver(() => {
  parent.postMessage({type: 'llw-document-height', height: Math.ceil(page.getBoundingClientRect().height)}, portfolioOrigin);
}).observe(page);
</script>
%%MOTION%%
</body>
</html>
