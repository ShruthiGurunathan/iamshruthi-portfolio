  <script>
    const face = document.querySelector('.dial');
    const dial = document.createElement('button');
    dial.className = face.className;
    dial.type = 'button';
    dial.setAttribute('aria-label', 'Turn the zero to change the colours');
    dial.append(...face.childNodes);
    face.replaceWith(dial);
    document.getElementById('dial-hint').hidden = false;
    let turns = 0;
    dial.addEventListener('click', () => {
      turns += 1;
      document.documentElement.dataset.colour = turns % 4;
      dial.style.setProperty('--turn', (turns * 90) + 'deg');
    });
    let lastWheelTurn = -Infinity;
    dial.addEventListener('wheel', event => {
      if (document.activeElement !== dial || event.deltaY === 0) return;
      event.preventDefault();
      if (event.timeStamp - lastWheelTurn < 500) return;
      lastWheelTurn = event.timeStamp;
      dial.click();
    }, { passive:false });
  </script>
